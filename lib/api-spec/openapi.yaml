openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PayMate - AUD on Solana API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contacts
    description: Contact management
  - name: invoices
    description: Invoice management
  - name: payment-links
    description: Payment link management
  - name: payment-requests
    description: Payment request management
  - name: recurring-payments
    description: Recurring payment management
  - name: splits
    description: Group expense splits
  - name: transactions
    description: Transaction history
  - name: dashboard
    description: Dashboard summary data

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List all contacts
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [contacts]
      summary: Create a contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    get:
      operationId: getContact
      tags: [contacts]
      summary: Get a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    put:
      operationId: updateContact
      tags: [contacts]
      summary: Update a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [contacts]
      summary: Delete a contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    get:
      operationId: getInvoice
      tags: [invoices]
      summary: Get an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    put:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /invoices/{id}/mark-paid:
    post:
      operationId: markInvoicePaid
      tags: [invoices]
      summary: Mark invoice as paid
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkPaidBody"
      responses:
        "200":
          description: Marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /payment-links:
    get:
      operationId: listPaymentLinks
      tags: [payment-links]
      summary: List all payment links
      responses:
        "200":
          description: List of payment links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentLink"
    post:
      operationId: createPaymentLink
      tags: [payment-links]
      summary: Create a payment link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentLinkBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"

  /payment-links/{id}:
    get:
      operationId: getPaymentLink
      tags: [payment-links]
      summary: Get a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [payment-links]
      summary: Delete a payment link
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /payment-requests:
    get:
      operationId: listPaymentRequests
      tags: [payment-requests]
      summary: List all payment requests
      responses:
        "200":
          description: List of payment requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRequest"
    post:
      operationId: createPaymentRequest
      tags: [payment-requests]
      summary: Create a payment request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"

  /payment-requests/{id}:
    get:
      operationId: getPaymentRequest
      tags: [payment-requests]
      summary: Get a payment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
    delete:
      operationId: deletePaymentRequest
      tags: [payment-requests]
      summary: Delete a payment request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /recurring-payments:
    get:
      operationId: listRecurringPayments
      tags: [recurring-payments]
      summary: List all recurring payments
      responses:
        "200":
          description: List of recurring payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecurringPayment"
    post:
      operationId: createRecurringPayment
      tags: [recurring-payments]
      summary: Create a recurring payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringPaymentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPayment"

  /recurring-payments/{id}:
    get:
      operationId: getRecurringPayment
      tags: [recurring-payments]
      summary: Get a recurring payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Recurring payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPayment"
    delete:
      operationId: deleteRecurringPayment
      tags: [recurring-payments]
      summary: Cancel a recurring payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancelled

  /splits:
    get:
      operationId: listSplits
      tags: [splits]
      summary: List all splits
      responses:
        "200":
          description: List of splits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Split"
    post:
      operationId: createSplit
      tags: [splits]
      summary: Create a group split
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSplitBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Split"

  /splits/{id}:
    get:
      operationId: getSplit
      tags: [splits]
      summary: Get a split
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Split"
    delete:
      operationId: deleteSplit
      tags: [splits]
      summary: Delete a split
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /splits/{id}/settle:
    post:
      operationId: settleSplitParticipant
      tags: [splits]
      summary: Mark a split participant as settled
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleParticipantBody"
      responses:
        "200":
          description: Updated split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Split"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Record a transaction (send payment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/rates:
    get:
      operationId: getExchangeRates
      tags: [dashboard]
      summary: Get mock exchange rates for AUDD
      responses:
        "200":
          description: Exchange rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRates"

  /transactions/export:
    get:
      operationId: exportTransactions
      tags: [transactions]
      summary: Export transactions as CSV data
      responses:
        "200":
          description: CSV rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionCsvRow"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Contact:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        walletAddress:
          type: string
        email:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, name, walletAddress, createdAt]

    CreateContactBody:
      type: object
      properties:
        name:
          type: string
        walletAddress:
          type: string
        email:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
      required: [name, walletAddress]

    Invoice:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        recipientName:
          type: string
        recipientWallet:
          type: string
        recipientEmail:
          type: string
          nullable: true
        amountAudd:
          type: number
        dueDate:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, sent, paid, overdue]
        txSignature:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
        paidAt:
          type: string
          nullable: true
      required: [id, title, recipientName, recipientWallet, amountAudd, status, createdAt]

    CreateInvoiceBody:
      type: object
      properties:
        title:
          type: string
        recipientName:
          type: string
        recipientWallet:
          type: string
        recipientEmail:
          type: string
          nullable: true
        amountAudd:
          type: number
        dueDate:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, sent, paid, overdue]
      required: [title, recipientName, recipientWallet, amountAudd, status]

    MarkPaidBody:
      type: object
      properties:
        txSignature:
          type: string
          nullable: true
      required: []

    PaymentLink:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        amountAudd:
          type: number
          nullable: true
        walletAddress:
          type: string
        slug:
          type: string
        active:
          type: boolean
        totalReceived:
          type: number
        paymentCount:
          type: integer
        createdAt:
          type: string
      required: [id, label, walletAddress, slug, active, totalReceived, paymentCount, createdAt]

    CreatePaymentLinkBody:
      type: object
      properties:
        label:
          type: string
        amountAudd:
          type: number
          nullable: true
        walletAddress:
          type: string
      required: [label, walletAddress]

    PaymentRequest:
      type: object
      properties:
        id:
          type: string
        toName:
          type: string
        toWallet:
          type: string
        amountAudd:
          type: number
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, paid, cancelled]
        createdAt:
          type: string
        paidAt:
          type: string
          nullable: true
      required: [id, toName, toWallet, amountAudd, status, createdAt]

    CreatePaymentRequestBody:
      type: object
      properties:
        toName:
          type: string
        toWallet:
          type: string
        amountAudd:
          type: number
        note:
          type: string
          nullable: true
      required: [toName, toWallet, amountAudd]

    RecurringPayment:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        recipientName:
          type: string
        recipientWallet:
          type: string
        amountAudd:
          type: number
        frequency:
          type: string
          enum: [weekly, monthly]
        nextRunAt:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
      required: [id, label, recipientName, recipientWallet, amountAudd, frequency, nextRunAt, active, createdAt]

    CreateRecurringPaymentBody:
      type: object
      properties:
        label:
          type: string
        recipientName:
          type: string
        recipientWallet:
          type: string
        amountAudd:
          type: number
        frequency:
          type: string
          enum: [weekly, monthly]
      required: [label, recipientName, recipientWallet, amountAudd, frequency]

    Split:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        totalAudd:
          type: number
        participants:
          type: array
          items:
            $ref: "#/components/schemas/SplitParticipant"
        createdAt:
          type: string
      required: [id, title, totalAudd, participants, createdAt]

    SplitParticipant:
      type: object
      properties:
        name:
          type: string
        walletAddress:
          type: string
        shareAudd:
          type: number
        settled:
          type: boolean
      required: [name, walletAddress, shareAudd, settled]

    CreateSplitBody:
      type: object
      properties:
        title:
          type: string
        totalAudd:
          type: number
        participants:
          type: array
          items:
            $ref: "#/components/schemas/CreateSplitParticipant"
      required: [title, totalAudd, participants]

    CreateSplitParticipant:
      type: object
      properties:
        name:
          type: string
        walletAddress:
          type: string
        shareAudd:
          type: number
      required: [name, walletAddress, shareAudd]

    SettleParticipantBody:
      type: object
      properties:
        walletAddress:
          type: string
      required: [walletAddress]

    Transaction:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [send, receive, invoice, split, payment_link, recurring]
        counterpartyName:
          type: string
          nullable: true
        counterpartyWallet:
          type: string
          nullable: true
        amountAudd:
          type: number
        txSignature:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, type, amountAudd, createdAt]

    CreateTransactionBody:
      type: object
      properties:
        type:
          type: string
          enum: [send, receive]
        counterpartyName:
          type: string
          nullable: true
        counterpartyWallet:
          type: string
          nullable: true
        amountAudd:
          type: number
        txSignature:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
      required: [type, amountAudd]

    TransactionCsvRow:
      type: object
      properties:
        date:
          type: string
        type:
          type: string
        counterparty:
          type: string
        amountAudd:
          type: number
        txSignature:
          type: string
        note:
          type: string
      required: [date, type, counterparty, amountAudd, txSignature, note]

    DashboardSummary:
      type: object
      properties:
        balanceAudd:
          type: number
        balanceAud:
          type: number
        balanceUsd:
          type: number
        totalSentAudd:
          type: number
        totalReceivedAudd:
          type: number
        pendingInvoicesCount:
          type: integer
        pendingInvoicesAudd:
          type: number
        activePaymentLinks:
          type: integer
        activeRecurring:
          type: integer
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
      required: [balanceAudd, balanceAud, balanceUsd, totalSentAudd, totalReceivedAudd, pendingInvoicesCount, pendingInvoicesAudd, activePaymentLinks, activeRecurring, recentTransactions]

    ExchangeRates:
      type: object
      properties:
        AUDD_AUD:
          type: number
        AUDD_USD:
          type: number
        AUDD_SOL:
          type: number
        updatedAt:
          type: string
      required: [AUDD_AUD, AUDD_USD, AUDD_SOL, updatedAt]
