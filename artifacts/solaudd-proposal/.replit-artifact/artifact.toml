kind = "web"
previewPath = "/"
title = "SolAUDD Grant Proposal"
version = "1.0.0"
id = "artifacts/solaudd-proposal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23875

[services.development]
run = "pnpm --filter @workspace/solaudd-proposal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solaudd-proposal", "run", "build" ]
publicDir = "artifacts/solaudd-proposal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23875"
BASE_PATH = "/"
